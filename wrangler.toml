"$schema" = "./node_modules/wrangler/config-schema.json"
# Local development only (`npm run dev`). There is deliberately no
# `pages_build_output_dir`, so Cloudflare Pages ignores this file and the
# production binding and variables are managed in the dashboard (see README).
name = "simple-r2-share"
compatibility_date = "2026-10-23"

# Local R2 bucket simulated by `wrangler pages dev`; seed it with `wrangler r2 object put --local`.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "your-bucket-name"

[vars]
# The bucket's existing public HTTPS base URL (custom domain or r2.dev).
# A value without a scheme (e.g. "files.example.com") gets https:// added.
R2_PUBLIC_BASE_URL = "https://files.example.com"
# Comma-separated exact DNS hostnames for external HTTPS README images.
# Example: "images.example.com,cdn.example.org". Empty blocks external images.
README_IMAGE_DOMAINS = ""
# Only the exact string "true" enables the "Download all" ZIP endpoint.
ENABLE_ZIP_DOWNLOAD = "false"
# Object key of the share rules file, relative to the bucket root.
SHARE_RULES_KEY = ".r2-share-rules"
# Trusted single-line footer HTML, rendered verbatim before the
# "Powered by Simple R2 Share" credit. Empty means only the credit.
FOOTER_HTML = ""
# Text of the top-left brand and the page title suffix. Empty means "SIMPLE R2 SHARE".
BRAND_NAME = ""
# Link target of the top-left brand. Empty means the brand is not a link.
BRAND_URL = ""
# Cloudflare Access team domain (https://<team>.cloudflareaccess.com) and the
# AUD tag of the Access application protecting /admin and /api/admin/*. The
# admin API refuses every request (403) unless both are set and the request
# carries a valid Access JWT, so locally the admin API always answers 403.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
